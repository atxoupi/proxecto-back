[project]
name = "proxecto-back"
version = "0.1.0"
description = "Backend con Django para dar servizo a una web comercial"
authors = [
    {name = "Andres Hermelo",email = "andres.hermelo@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
] 

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.1,<0.15.0)"
]
